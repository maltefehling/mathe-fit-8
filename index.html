<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathe-Fit 8</title>
<meta name="description" content="Grundlagen-Check Mathematik Klasse 8 (Realschule): Diagnoseaufgaben mit Lernvideos und Kontrollaufgaben.">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#5b6475; --line:#d9dde5;
  --accent:#1f5fae; --accent-text:#fff;
  --ok:#1e7d3c; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fbe5e3;
  --auftrag:#e6f4ea; --auftrag-line:#9fd1ae;
  --hilfe:#fdebd3; --hilfe-line:#f0bf80;
  --merk:#e3f0fb; --merk-line:#9cc4ea;
  --lehrer:#eeeff2;
  --grid:#e2e5ea; --axis:#3a4150; --g1:#1f5fae; --g2:#c2410c; --fill:#c9dcf3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --card:#1d2128; --text:#e6e8ec; --muted:#a3abb9; --line:#343a45;
    --accent:#6ea8ef; --accent-text:#0d1420;
    --ok:#6fd08f; --ok-bg:#163222; --bad:#f2958d; --bad-bg:#3a1d1b;
    --auftrag:#18301f; --auftrag-line:#3c7a4f;
    --hilfe:#3a2a14; --hilfe-line:#8a6326;
    --merk:#15283d; --merk-line:#3a6a99;
    --lehrer:#262a31;
    --grid:#2c323c; --axis:#c3c9d4; --g1:#6ea8ef; --g2:#f59e5b; --fill:#26405f;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.6rem;margin:.4em 0 .2em}
h2{font-size:1.25rem;margin:.2em 0 .5em}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.box{border-radius:10px;padding:12px 14px;margin:12px 0;border:1px solid}
.auftrag{background:var(--auftrag);border-color:var(--auftrag-line)}
.hilfe{background:var(--hilfe);border-color:var(--hilfe-line)}
.merk{background:var(--merk);border-color:var(--merk-line)}
.lehrer{background:var(--lehrer);border-color:var(--line)}
.btn{display:inline-block;border:0;border-radius:10px;padding:11px 18px;background:var(--accent);color:var(--accent-text);font-weight:600;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.linkbtn{background:none;border:0;color:var(--accent);padding:4px 0;text-decoration:underline}
/* Bereichsauswahl */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.bereich{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;color:var(--text)}
.bereich:hover{border-color:var(--accent)}
.bereich b{display:block;font-size:1.08rem;margin-bottom:4px}
.bar{height:8px;border-radius:4px;background:var(--grid);overflow:hidden;margin:10px 0 6px;display:flex}
.bar span{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .y{background:#d9a227} .bar .r{background:var(--bad)}
/* Übersicht Teilgebiete */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:4px 11px;font-size:.85rem;display:flex;gap:6px;align-items:center}
.chip.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.mark{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:.8rem;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.mark.ok1{background:var(--ok);border-color:var(--ok);color:#fff}
.mark.ok2{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.mark.fail{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:6px}
.legend span{display:flex;gap:5px;align-items:center}
/* Aufgabe */
.label{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
.q{font-size:1.08rem}
.q svg{display:block;margin:12px auto 4px;max-width:100%;height:auto}
.eq{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:1.15rem;margin:6px 0 6px 10px;display:flex;align-items:center;gap:10px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.15}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.opts{display:grid;gap:10px;margin-top:10px}
.opts.graphs{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.opt{text-align:left;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--merk)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt .lt{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);font-weight:700;font-size:.9rem}
.opts.graphs .opt{flex-direction:column;align-items:center}
.opts.graphs svg{width:100%;height:auto}
.vals{display:inline-flex;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.vals span{padding:2px 10px;border-left:1px solid var(--line);min-width:44px;text-align:center}
.vals span:first-child{border-left:0}
table.wt{border-collapse:collapse;margin:8px 0}
table.wt td,table.wt th{border:1px solid var(--line);padding:3px 10px;text-align:center}
.feedback{font-weight:700;font-size:1.1rem}
.feedback.ok{color:var(--ok)} .feedback.bad{color:var(--bad)}
.videos a{display:inline-flex;gap:6px;align-items:center;margin:4px 10px 4px 0}
.tally{letter-spacing:2px;font-family:Georgia,serif;font-weight:700}
.t5{position:relative;display:inline-block;margin-right:6px}
.t5::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;border-top:2px solid currentColor;transform:rotate(-22deg)}
table.sum{width:100%;border-collapse:collapse}
table.sum td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
footer{margin-top:28px;font-size:.85rem;color:var(--muted)}
@media (max-width:520px){ body{font-size:16px} .card{padding:14px} .opts.graphs{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<main id="app"></main>
<script>
"use strict";
/* ================= Hilfsfunktionen ================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rd=(x,d=2)=>Math.round(x*10**d)/10**d;
const nz=(a,b)=>{let v;do{v=rnd(a,b)}while(v===0);return v};
const isHalf=v=>Math.abs(v*2-Math.round(v*2))<1e-9;
// Zahl deutsch formatieren, echtes Minuszeichen
const nf=(n,d=2,min=0)=>rd(n,d).toLocaleString("de-DE",{maximumFractionDigits:d,minimumFractionDigits:min}).replace("-","−");
const eur=n=>Number.isInteger(rd(n,2))?nf(n,0)+"&nbsp;€":nf(n,2,2)+"&nbsp;€";
const eur2=n=>nf(n,2,2)+"&nbsp;€";
const pct1=n=>"ca. "+nf(n,1,1)+"&nbsp;%";
const pct=n=>nf(n,2)+"&nbsp;%";
const frac=(z,n)=>`<span class="frac"><span>${z}</span><span>${n}</span></span>`;
const coef=(m,v="x")=>m===1?v:m===-1?"−"+v:nf(m)+v;
function term(m,b){ // y = mx + b
  let s="y = ";
  if(m!==0) s+=coef(m);
  if(b!==0) s+= m===0 ? nf(b) : (b>0?" + ":" − ")+nf(Math.abs(b));
  if(m===0&&b===0) s+="0";
  return s;
}
function lin(a,b,c){ // ax + by = c
  let s="";
  if(a!==0) s+=coef(a,"x");
  if(b!==0) s+= s ? (b>0?" + ":" − ")+coef(Math.abs(b),"y") : coef(b,"y");
  return s+" = "+nf(c);
}
const eqs=(...l)=>l.map((e,i)=>`<div class="eq"><span>(${i+1})</span><span>${e}</span></div>`).join("");
const pm=v=>v<0?" − "+nf(-v):" + "+nf(v);
function mc(q,ok,...ds){return {q,options:[{html:ok,ok:true},...ds.map(h=>({html:h}))]};}

/* ================= SVG-Bausteine ================= */
let clipId=0;
function ks({min=-5,max=5,size=280,lines=[],points=[],curve=null,labels=true,step=1}={}){
  const pad=18, n=max-min, s=(size-2*pad)/n;
  const X=x=>pad+(x-min)*s, Y=y=>size-pad-(y-min)*s;
  const id="c"+(++clipId);
  let g=`<svg viewBox="0 0 ${size} ${size}" width="${size}" xmlns="http://www.w3.org/2000/svg" role="img">`;
  g+=`<defs><clipPath id="${id}"><rect x="${X(min)}" y="${Y(max)}" width="${n*s}" height="${n*s}"/></clipPath></defs>`;
  for(let i=min;i<=max;i++){
    g+=`<line x1="${X(i)}" y1="${Y(min)}" x2="${X(i)}" y2="${Y(max)}" stroke="var(--grid)"/>`;
    g+=`<line x1="${X(min)}" y1="${Y(i)}" x2="${X(max)}" y2="${Y(i)}" stroke="var(--grid)"/>`;
  }
  g+=`<line x1="${X(min)}" y1="${Y(0)}" x2="${X(max)+8}" y2="${Y(0)}" stroke="var(--axis)" stroke-width="1.4"/>`;
  g+=`<line x1="${X(0)}" y1="${Y(min)}" x2="${X(0)}" y2="${Y(max)-8}" stroke="var(--axis)" stroke-width="1.4"/>`;
  g+=`<path d="M${X(max)+8} ${Y(0)} l-6 -3.5 v7z M${X(0)} ${Y(max)-8} l-3.5 6 h7z" fill="var(--axis)"/>`;
  const fs=Math.max(9,Math.min(12,s*.55));
  if(labels) for(let i=min;i<=max;i++){ if(i===0||i%step) continue;
    g+=`<text x="${X(i)}" y="${Y(0)+fs+2}" font-size="${fs}" text-anchor="middle" fill="var(--muted)">${nf(i)}</text>`;
    g+=`<text x="${X(0)-4}" y="${Y(i)+fs/3}" font-size="${fs}" text-anchor="end" fill="var(--muted)">${nf(i)}</text>`;
  }
  g+=`<text x="${X(max)+6}" y="${Y(0)-6}" font-size="12" fill="var(--axis)">x</text><text x="${X(0)+6}" y="${Y(max)-2}" font-size="12" fill="var(--axis)">y</text>`;
  g+=`<g clip-path="url(#${id})">`;
  for(const l of lines){ g+=`<line x1="${X(min-1)}" y1="${Y(l.m*(min-1)+l.b)}" x2="${X(max+1)}" y2="${Y(l.m*(max+1)+l.b)}" stroke="${l.c||"var(--g1)"}" stroke-width="2.4"/>`; }
  if(curve){ let d=""; for(let x=min;x<=max+1e-9;x+=(max-min)/120){ d+=(d?"L":"M")+X(x).toFixed(1)+" "+Y(curve(x)).toFixed(1)+" "; } g+=`<path d="${d}" fill="none" stroke="var(--g1)" stroke-width="2.4"/>`; }
  g+=`</g>`;
  for(const p of points){ g+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="var(--g2)"/><text x="${X(p.x)+6}" y="${Y(p.y)-7}" font-size="14" font-weight="700" fill="var(--g2)">${p.l}</text>`; }
  return g+"</svg>";
}
function boxplotSvg(k,amin,amax){
  const W=360,H=110,pad=20,s=(W-2*pad)/(amax-amin), X=v=>pad+(v-amin)*s, y0=20, h=34, ym=y0+h/2, ay=82;
  let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" role="img">`;
  g+=`<line x1="${X(k[0])}" y1="${ym}" x2="${X(k[1])}" y2="${ym}" stroke="var(--g1)" stroke-width="2"/>`;
  g+=`<line x1="${X(k[3])}" y1="${ym}" x2="${X(k[4])}" y2="${ym}" stroke="var(--g1)" stroke-width="2"/>`;
  g+=`<line x1="${X(k[0])}" y1="${y0+8}" x2="${X(k[0])}" y2="${y0+h-8}" stroke="var(--g1)" stroke-width="2"/>`;
  g+=`<line x1="${X(k[4])}" y1="${y0+8}" x2="${X(k[4])}" y2="${y0+h-8}" stroke="var(--g1)" stroke-width="2"/>`;
  g+=`<rect x="${X(k[1])}" y="${y0}" width="${X(k[3])-X(k[1])}" height="${h}" fill="var(--fill)" stroke="var(--g1)" stroke-width="2"/>`;
  g+=`<line x1="${X(k[2])}" y1="${y0}" x2="${X(k[2])}" y2="${y0+h}" stroke="var(--g1)" stroke-width="2.5"/>`;
  g+=`<line x1="${X(amin)}" y1="${ay}" x2="${X(amax)}" y2="${ay}" stroke="var(--axis)" stroke-width="1.4"/>`;
  for(let v=amin;v<=amax;v++){ g+=`<line x1="${X(v)}" y1="${ay-4}" x2="${X(v)}" y2="${ay+4}" stroke="var(--axis)"/>`; if(v%2===0) g+=`<text x="${X(v)}" y="${ay+18}" font-size="12" text-anchor="middle" fill="var(--muted)">${v}</text>`; }
  for(const v of k){ g+=`<line x1="${X(v)}" y1="${y0+h+2}" x2="${X(v)}" y2="${ay-4}" stroke="var(--grid)" stroke-dasharray="2 3"/>`; }
  return g+"</svg>";
}
function polySvg(pts,labels,W=320,H=190){ // pts in Längeneinheiten, y nach oben
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const pad=34,s=Math.min((W-2*pad)/(maxx-minx),(H-2*pad)/(maxy-miny));
  const ox=(W-(maxx-minx)*s)/2, oy=(H-(maxy-miny)*s)/2;
  const X=x=>ox+(x-minx)*s, Y=y=>H-oy-(y-miny)*s;
  let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" role="img">`;
  g+=`<polygon points="${pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}" fill="var(--fill)" stroke="var(--g1)" stroke-width="2"/>`;
  for(const L of labels){
    if(L.h){ g+=`<line x1="${X(L.h[0][0])}" y1="${Y(L.h[0][1])}" x2="${X(L.h[1][0])}" y2="${Y(L.h[1][1])}" stroke="var(--g2)" stroke-width="2" stroke-dasharray="5 4"/>`;
      g+=`<text x="${X(L.h[0][0])+(L.left?-6:6)}" y="${(Y(L.h[0][1])+Y(L.h[1][1]))/2+18}" font-size="14" fill="var(--g2)" font-weight="700" text-anchor="${L.left?"end":"start"}">${L.t}</text>`; }
    else g+=`<text x="${X(L.x)}" y="${Y(L.y)}" font-size="14" text-anchor="middle" fill="var(--text)" font-weight="600">${L.t}</text>`;
  }
  for(const P of pts.filter(p=>p[2])) g+=`<text x="${X(P[0])+(P[3]||0)}" y="${Y(P[1])+(P[4]||0)}" font-size="13" fill="var(--muted)" text-anchor="middle">${P[2]}</text>`;
  return g+"</svg>";
}
function barSvg(vals,names){
  const W=300,H=200,l=40,b=170,top=15,max=Math.ceil(Math.max(...vals)/10)*10, s=(b-top)/max;
  const cols=["var(--g1)","var(--g2)","#6b8e23"];
  let g=`<svg viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" role="img">`;
  for(let v=0;v<=max;v+=5){ g+=`<line x1="${l}" y1="${b-v*s}" x2="${W-10}" y2="${b-v*s}" stroke="${v%10?"var(--grid)":"var(--line)"}" ${v%10?'stroke-dasharray="3 3"':""}/>`; if(v%10===0) g+=`<text x="${l-6}" y="${b-v*s+4}" font-size="12" text-anchor="end" fill="var(--muted)">${v} €</text>`; }
  vals.forEach((v,i)=>{ const x=l+25+i*80; g+=`<rect x="${x}" y="${b-v*s}" width="46" height="${v*s}" fill="${cols[i]}"/><text x="${x+23}" y="${b+18}" font-size="13" text-anchor="middle" fill="var(--text)">${names[i]}</text>`; });
  g+=`<line x1="${l}" y1="${b}" x2="${W-10}" y2="${b}" stroke="var(--axis)"/>`;
  return g+"</svg>";
}
function tally(n){ let s=""; for(let i=0;i<Math.floor(n/5);i++) s+=`<span class="t5">IIII</span>`; return `<span class="tally">${s}${"I".repeat(n%5)}</span>`; }

/* ============ Lineare Funktionen ============ */
function genPunkte(){
  const c=()=>nz(-4,4); let A,B;
  do{A=[c(),c()];B=[c(),c()];}while(Math.abs(A[0])===Math.abs(A[1])||Math.abs(B[0])===Math.abs(B[1])||(Math.sign(A[0])===Math.sign(B[0])&&Math.sign(A[1])===Math.sign(B[1])));
  const P=(n,p)=>`${n}(${nf(p[0])}&nbsp;|&nbsp;${nf(p[1])})`, S=(a,b)=>P("A",a)+" und "+P("B",b), sw=p=>[p[1],p[0]];
  return mc(`Gib die Koordinaten der Punkte A und B an.`+ks({points:[{x:A[0],y:A[1],l:"A"},{x:B[0],y:B[1],l:"B"}]}),
    S(A,B), S(sw(A),sw(B)), S(A,sw(B)), S([A[0],-A[1]],B));
}
function genFunktionsbegriff(){
  const C=pick([
    ()=>{const g=pick([5,8,10,12]),p=pick([1.5,2,2.5,3]);return{t:`Ein Handytarif kostet ${nf(g)} € Grundgebühr im Monat. Für jedes Gigabyte Datenvolumen kommen ${nf(p,2,2)} € dazu.`,x:"Anzahl der Gigabyte",y:"Kosten in €",m:p,b:g}},
    ()=>{const g=pick([3.5,4,4.5,5]),p=pick([2,2.5,3]);return{t:`Ein Taxi verlangt ${nf(g,2,2)} € Grundpreis und ${nf(p,2,2)} € für jeden gefahrenen Kilometer.`,x:"gefahrene Kilometer",y:"Fahrpreis in €",m:p,b:g}},
    ()=>{const g=pick([20,30,40,50]),p=pick([15,19,25,29]);return{t:`Ein Fitnessstudio verlangt einmalig ${g} € Aufnahmegebühr und dann ${p} € pro Monat.`,x:"Anzahl der Monate",y:"Gesamtkosten in €",m:p,b:g}},
    ()=>{const h=pick([18,20,24,30]),p=pick([1.5,2,2.5]);return{t:`Eine Kerze ist ${h} cm hoch. Wenn sie brennt, wird sie pro Stunde um ${nf(p)} cm kürzer.`,x:"Brenndauer in Stunden",y:"Höhe der Kerze in cm",m:-p,b:h}},
    ()=>{const v=pick([300,400,500,600]),p=pick([12,15,20,25]);return{t:`In einem Wassertank sind ${v} Liter Wasser. Pro Minute werden ${p} Liter abgepumpt.`,x:"Zeit in Minuten",y:"Wassermenge in Litern",m:-p,b:v}},
  ])();
  return mc(`${C.t}<br>x: ${C.x}, y: ${C.y}<br><b>Welche Funktionsgleichung beschreibt die Situation?</b>`,
    term(C.m,C.b), term(C.b,C.m), term(-C.m,C.b), C.m>0?term(rd(C.m+C.b),0):term(C.m,-C.b));
}
function genWertetabelle(){
  const m=pick([-3,-2,2,3,0.5,-0.5]), b=nz(-4,4), xs=[-2,-1,0,1,2];
  const row=f=>`<span class="vals">${xs.map(x=>`<span>${nf(f(x))}</span>`).join("")}</span>`;
  return mc(`Lege im Heft eine Wertetabelle für die Funktion <b>${term(m,b)}</b> an und zeichne den Graphen.<table class="wt"><tr><th>x</th>${xs.map(x=>`<td>${nf(x)}</td>`).join("")}</tr><tr><th>y</th>${xs.map(()=>"<td>?</td>").join("")}</tr></table><b>Welche y-Werte stehen in deiner Tabelle?</b>`,
    row(x=>m*x+b), row(x=>m*x-b), row(x=>m*Math.abs(x)+b), row(x=>m*(x+b)));
}
function genProportional(){
  const orig=Math.random()<.5;
  const m=pick(orig?[0.5,2,-1,-2,1.5,-0.5,3,-3]:[0.5,1,2,-1,-2,1.5,-0.5,3]);
  const b=orig?0:nz(-3,3);
  const q=`Handelt es sich bei der abgebildeten Geraden um den Graphen einer <b>proportionalen</b> Funktion? Begründe im Heft und wähle dann.`+ks({lines:[{m,b}]});
  if(orig) return mc(q,"Ja, denn der Graph ist eine Gerade durch den Ursprung (0&nbsp;|&nbsp;0).",

const S2=(x,y)=>`x = ${nf(x)}&nbsp;&nbsp;;&nbsp;&nbsp;y = ${nf(y)}`;
function lgsMC(q,x0,y0,E){ // E: normierte Gleichungen [a,b] (c wird aus Lösung berechnet)
  const N=E.map(([a,b])=>[a,b,a*x0+b*y0]);
  const onEq=([a,b,c])=>shuffle([-x0,x0+1,x0-1,x0+2,x0-2,x0+3]).filter(x=>x!==x0).map(x=>[x,rd((c-a*x)/b,6)]).filter(([,y])=>isHalf(y)&&Math.abs(y)<=25);
  const l1=onEq(N[0]), l2=onEq(N[1]);
  const pool=[...(x0!==y0?[[y0,x0]]:[]), l1[0], l2[0], l1[1], l2[1], [x0,y0+1], [x0+1,y0]].filter(Boolean);
  const seen=new Set([x0+","+y0]), ds=[];
  for(const p of pool){ const k=p[0]+","+p[1]; if(!seen.has(k)){seen.add(k);ds.push(S2(p[0],p[1]));} if(ds.length===3) break; }
  return mc(q,S2(x0,y0),...ds);
}

  if(typ==="kn"){ q=`Du legst ${nf(K)} € für ein Jahr bei einer Bank an. Die Bank zahlt ${nf(p)} % Zinsen pro Jahr. Wie viel Geld hast du nach einem Jahr insgesamt?`; v=[K+Z,Z,K+p,K*(1+p/10)]; f=eur2; }
  else if(typ==="z"){ q=`Du legst ${nf(K)} € für ein Jahr bei einer Bank an. Die Bank zahlt ${nf(p)} % Zinsen pro Jahr. Wie viel Zinsen bekommst du?`; v=[Z,K+Z,Z*10,Z/10]; f=eur2; }
  else if(typ==="p"){ q=`Du hast ${nf(K)} € für ein Jahr angelegt und dafür ${eur2(Z)} Zinsen bekommen. Welchen Zinssatz zahlt die Bank?`; v=[p,p*10,p/10,Z]; f=pct; }
  else { q=`Bei einem Zinssatz von ${nf(p)} % hast du nach einem Jahr ${eur2(Z)} Zinsen bekommen. Wie viel Geld hattest du angelegt?`; v=[K,K*10,K/10,Z*p]; f=eur2; }
  if(new Set(v.map(x=>rd(x,2))).size<4) return null;
  return mc(q, ...v.map(f));
}

function genStrichliste(){
  const k=rnd(3,7),z=rnd(3,7); if(k===z) return null;
  const seq=(kk,zz)=>shuffle([...Array(kk).fill("Kopf"),...Array(zz).fill("Zahl")]).join(", ");
  return mc(`Eine Münze wurde mehrmals geworfen. Das Ergebnis wurde in einer Strichliste festgehalten:<table class="wt"><tr><th>Seite</th><th>Strichliste</th></tr><tr><td>Kopf</td><td>${tally(k)}</td></tr><tr><td>Zahl</td><td>${tally(z)}</td></tr></table><b>Welche Wurfreihe passt zu dieser Strichliste?</b>`,
    seq(k,z), seq(z,k), seq(k+1,z), seq(k,z-1));
}
function genDiagramm(){
  const vals=shuffle([5,10,15,20,25,30,35,40,45]).slice(0,3), n=["8a","8b","8c"];
  const [i,j]=shuffle([0,1,2]).slice(0,2), hi=vals[i]>vals[j]?i:j, lo=hi===i?j:i, k=3-i-j;
  const d=vals[hi]-vals[lo];
  const cand=[d,vals[hi],d+5,d-5,Math.abs(vals[hi]-vals[k])].filter(x=>x>0);
  const opts=[...new Set(cand)].slice(0,4); if(opts.length<4||opts[0]!==d) return null;
  return mc(`Das Diagramm zeigt, wie viel Geld in den Klassenkassen ist.`+barSvg(vals,n)+`<b>Wie viel Euro hat die ${n[hi]} mehr in der Klassenkasse als die ${n[lo]}?</b>`, ...opts.map(x=>x+" €"));
}
function genMedian(){
  const L=Array.from({length:6},()=>rnd(2,20)), s=L.slice().sort((a,b)=>a-b);
  const med=(s[2]+s[3])/2, raw=(L[2]+L[3])/2, sp=s[5]-s[0], mean=rd(L.reduce((a,b)=>a+b)/6,1);
  const S=(m,r)=>`Zentralwert: ${nf(m)}&nbsp;&nbsp;;&nbsp;&nbsp;Spannweite: ${nf(r)}`;
  const cand=[[med,sp],[raw,sp],[med,s[5]],[mean,sp],[med,sp+1]].map(x=>S(...x));
  const opts=[...new Set(cand)].slice(0,4); if(opts.length<4) return null;
  return mc(`Bei einem Vokabeltest haben sechs Kinder folgende Punktzahlen erreicht:<div class="eq">${L.join("&nbsp;&nbsp;&nbsp;")}</div>Gib den Zentralwert (Median) und die Spannweite an. Schreibe dazu im Heft zuerst die Rangliste auf.`, ...opts);
}
function genBoxKennwerte(){
  const mn=rnd(4,14), qu=mn+rnd(2,4), md=qu+rnd(1,3), qo=md+rnd(1,3), mx=qo+rnd(2,6);
  const amin=mn-2-(mn%2), amax=mx+2+(mx%2);
  const S=k=>`Min: ${k[0]} | q<sub>u</sub>: ${k[1]} | Median: ${k[2]} | q<sub>o</sub>: ${k[3]} | Max: ${k[4]}`;
  const k=[mn,qu,md,qo,mx], m2=md+1<qo?md+1:md-1;
  return mc(`Lies die Kennwerte des Boxplots ab.`+boxplotSvg(k,amin,amax)+`<span class="muted">Kann man aus dem Boxplot auch das arithmetische Mittel ablesen? Notiere deine Antwort im Heft.</span>`,
    S(k), S(k.map(x=>x+1)), S([mn,qu,m2,qo,mx]), S([mn,qu-1,md,qo+1,mx]));
}
function quart(v){return [v[0],(v[1]+v[2])/2,(v[3]+v[4])/2,(v[5]+v[6])/2,v[7]];}
function genBoxReihe(){
  const v=[rnd(1,5)]; for(let i=1;i<8;i++) v.push(v[i-1]+rnd(0,4));
  const k=quart(v); if(new Set(k).size<5) return null;
  const variant=(idx)=>{ for(const d of shuffle([2,-2,1,-1,3,-3])){ const w=v.slice(); w[idx]+=d; if(w[idx]<w[idx-1]||w[idx]>w[idx+1]) continue; if(String(quart(w))!==String(k)) return w; } return null; };
  const ds=[variant(pick([1,2])),variant(pick([3,4])),variant(pick([5,6]))]; if(ds.some(x=>!x)) return null;
  const S=a=>a.join("&nbsp;&nbsp;·&nbsp;&nbsp;");
  return mc(`Welche Rangliste gehört zum abgebildeten Boxplot? Bestimme im Heft für jede Liste die Kennwerte.`+boxplotSvg(k.map(x=>x),0,Math.ceil((v[7]+2)/2)*2), S(v), ...ds.map(S));
}

// Speichercode: 2 Bit je Teilgebiet, Crockford-Base32, 14 Zeichen + 1 Prüfzeichen
const ALPH="0123456789ABCDEFGHJKMNPQRSTVWXYZ", CODES=[null,"ok1","ok2","fail"];
const allItems=()=>BEREICHE.flatMap(b=>b.items);
function encodeCode(){
  let v=0n; for(const it of allItems()) v=v*4n+BigInt(Math.max(0,CODES.indexOf(ST[it.id]||null)));
  let d=[]; for(let i=0;i<14;i++){ d.unshift(Number(v%32n)); v/=32n; }
  d.push(d.reduce((a,x,i)=>a+x*(i+1),0)%32);
  const s=d.map(x=>ALPH[x]).join(""); return s.slice(0,5)+"-"+s.slice(5,10)+"-"+s.slice(10);
}
function decodeCode(str){
  const s=str.toUpperCase().replace(/O/g,"0").replace(/[IL]/g,"1").replace(/[^0-9A-Z]/g,"");
  if(s.length!==15) return null;
  const d=[...s].map(c=>ALPH.indexOf(c)); if(d.some(x=>x<0)) return null;
  if(d.slice(0,14).reduce((a,x,i)=>a+x*(i+1),0)%32!==d[14]) return null;
  let v=0n; for(const x of d.slice(0,14)) v=v*32n+BigInt(x);
  const items=allItems(), st={};
  for(let i=items.length-1;i>=0;i--){ const c=Number(v%4n); v/=4n; if(c) st[items[i].id]=CODES[c]; }
  return v===0n?st:null;
}

    <span class="small muted">${c.n} Teilgebiete · ${c.done} bearbeitet · ${c.ok1+c.ok2} richtig</span>
    <div class="bar"><span class="g" style="width:${c.ok1/c.n*100}%"></span><span class="y" style="width:${c.ok2/c.n*100}%"></span><span class="r" style="width:${c.fail/c.n*100}%"></span></div>
    <span class="row" style="gap:4px">${b.items.map(it=>markHtml(stat(it.id))).join("")}</span></button>`;}).join("")}</div>
  ${legend}
  ${codeBox()}
  <footer>
    <p>Dein Fortschritt wird nur in diesem Browser auf diesem Gerät gespeichert. Es werden keine Daten an einen Server geschickt. Wenn du am Ende der Stunde auf „Abmelden“ tippst, kann die nächste Person ihr eigenes Profil anlegen. <button class="linkbtn" id="reset">Meinen Fortschritt löschen</button></p>
    <p>Die Lernvideos und Übungen sind Links zu anderen Webseiten (z.&nbsp;B. YouTube, LearningApps, GeoGebra). Sie öffnen sich in einem neuen Tab, dort gelten die Datenschutzbestimmungen der jeweiligen Anbieter.</p>
    <p><button class="linkbtn" id="info">Quellen und Hinweise</button></p>
  </footer>`;
  app.querySelectorAll("[data-b]").forEach(el=>el.onclick=()=>openBereich(el.dataset.b));
  document.getElementById("reset").onclick=()=>{ if(confirm("Willst du deinen gesamten Fortschritt auf diesem Gerät löschen?")){ ST={}; save(); home(); } };
  document.getElementById("logout").onclick=()=>{ logout(); loginScreen(home); };
  document.getElementById("info").onclick=info;
  window.scrollTo(0,0);
}

function info(){
  app.innerHTML=`<div class="topbar"><button class="linkbtn" id="back">← Startseite</button></div>
  <div class="card"><h2>Quellen und Hinweise</h2>
  <p>Die Gliederung in Bereiche und Teilgebiete sowie die Auswahl der Lernvideos und Übungen orientieren sich an den Checklisten „Bin ich fit?!“ der Fachredaktion Mathematik des Landesbildungsservers Baden-Württemberg (Autor: Fabrice Takin).</p>
  <p>Alle Aufgaben in dieser App wurden <b>neu formuliert</b> und werden bei jedem Aufruf mit neuen Zahlen erzeugt. Es werden keine Texte, Bilder oder Grafiken aus den Originalblättern verwendet; alle Abbildungen werden direkt im Browser gezeichnet.</p>
  <p>Die Lernvideos stammen überwiegend von <a href="https://www.180grad-flip.de" target="_blank" rel="noopener">180grad-flip.de</a> (Sebastian Stoll) sowie von „Mathe by Daniel Jung“ und „Matheretter“. Sie werden nur verlinkt, nicht eingebettet oder kopiert. Die Übungen sind Links auf LearningApps.org, GeoGebra, ZUM, LearningSnacks und schlauerlernen.de. Für die Inhalte dieser Seiten sind die jeweiligen Anbieter verantwortlich.</p>
  <p>Der Fortschritt wird unter einem selbst gewählten Fantasienamen nur im Browser dieses Geräts gespeichert. Der Speichercode enthält ausschließlich den Bearbeitungsstand (keinen Namen) und wird nirgendwohin übertragen.</p>
  <p>Diese App ist ein kostenloses, nicht-kommerzielles Unterrichtsangebot. Sie verwendet keine Cookies, kein Tracking und lädt keine externen Schriften oder Skripte.</p>
  </div>`;
  document.getElementById("back").onclick=home; window.scrollTo(0,0);
}

function openBereich(bid,idx){
  const b=BEREICHE.find(x=>x.id===bid); if(!b) return home();
  if(idx==null){ idx=b.items.findIndex(it=>!stat(it.id)); if(idx<0) return summary(b); }
  history.replaceState(null,"","#"+bid);
  cur={b,i:idx,phase:"main",task:makeTask(b.items[idx]),sel:null,checked:false,revealed:false,videoSeen:false};
  render();
}
function nextItem(){
  const b=cur.b; const n=b.items.length;
  for(let k=1;k<=n;k++){ const j=(cur.i+k)%n; if(!stat(b.items[j].id)) return openBereich(b.id,j); }
  summary(b);
}

function header(){
  const b=cur.b;
  return `<div class="topbar"><button class="linkbtn" id="back">← Alle Bereiche</button><span class="small muted">👤 ${esc(DB.cur)} · ${counts(b).done} von ${b.items.length} bearbeitet · ${counts(b).ok1+counts(b).ok2} richtig · <button class="linkbtn" onclick="this.closest('main').querySelector('#cbx').innerHTML=codeBox()">Speichercode</button></span></div><div id="cbx"></div>
  <h2 style="margin-top:6px">${b.titel}</h2>
  <div class="chips">${b.items.map((it,i)=>`<button class="chip ${i===cur.i?"cur":""}" data-i="${i}" title="${it.t}">${markHtml(stat(it.id))}${i+1}</button>`).join("")}</div>${legend}`;
}

function render(){
  const {b,i,task,phase}=cur, it=b.items[i];
  const lbl=phase==="main"?"Aufgabe":"Kontrollaufgabe";
  let h=header()+`<div class="card"><div class="label">Teilgebiet ${i+1} von ${b.items.length} · ${lbl}</div><h2>${it.t}</h2>`;
  if(phase!=="main") h+=`<div class="box merk small">Das ist eine ähnliche Aufgabe mit anderen Zahlen. Zeig, dass du es jetzt kannst!</div>`;
  h+=`<div class="q">${task.q}</div>`;
  if(!cur.revealed){
    h+=`<div class="box auftrag">✏️ <b>Bearbeite die Aufgabe zuerst schriftlich in deinem Heft</b> – mit Überschrift „${it.t}“ und vollständigem Rechenweg. Erst wenn du ein Ergebnis hast, lässt du dir die Antworten anzeigen.</div>
      <button class="btn" id="reveal">Ich habe die Aufgabe im Heft gelöst – Antworten zeigen</button>`;
  } else {
    h+=`<p class="small muted" style="margin-bottom:0">Welche Antwort stimmt mit deinem Ergebnis im Heft überein?</p><div class="opts ${task.graphs?"graphs":""}">`+
      task.options.map((o,k)=>{ let c="opt"; if(cur.sel===k) c+=" sel";
        if(cur.checked){ if(o.ok&&(cur.sel===k||cur.showRight)) c+=" right"; else if(cur.sel===k) c+=" wrong"; }
        return `<button class="${c}" data-o="${k}" ${cur.checked?"disabled":""}><span class="lt">${"ABCD"[k]}</span><span>${o.html}</span></button>`; }).join("")+`</div>`;
    if(!cur.checked) h+=`<div class="row" style="margin-top:14px"><button class="btn" id="check" ${cur.sel==null?"disabled":""}>Antwort prüfen</button></div>`;
    else h+=feedback(it);
  }
  h+=`</div>`;
  app.innerHTML=h;
  bind();
}

function videoBox(it,txt){
  return `<div class="box hilfe"><b>${txt}</b><div class="videos">${it.v.map(([l,id])=>`<a href="${YT(id)}" target="_blank" rel="noopener" class="vlink">▶ ${l} (YouTube)</a>`).join("")}</div>
  ${it.f?`<div class="small">Mehr zum Thema: <a href="${it.f}" target="_blank" rel="noopener" class="vlink">Themenseite auf 180grad-flip.de</a></div>`:""}
  ${it.u?`<div class="small">Zum Üben: <a href="${it.u}" target="_blank" rel="noopener">interaktive Übung</a></div>`:""}</div>`;
}

function feedback(it){
  const ok=cur.task.options[cur.sel].ok;
  if(ok){
    const after=cur.phase==="main"?"":" Das Video hat geholfen.";
    return `<p class="feedback ok">✓ Richtig!${after}</p>${it.u?`<p class="small muted">Wenn du noch mehr üben willst: <a href="${it.u}" target="_blank" rel="noopener">interaktive Übung</a></p>`:""}
      <div class="row"><button class="btn" id="next">Weiter zum nächsten Teilgebiet →</button></div>`;
  }
  if(cur.phase==="main"){
    return `<p class="feedback bad">✗ Das stimmt leider noch nicht.</p>
      <p>Vergleiche mit deinem Rechenweg im Heft. Schau dir jetzt das Lernvideo an und mach dir dabei Notizen. Danach bekommst du eine ähnliche Kontrollaufgabe.</p>
      ${videoBox(it,"Lernvideo")}
      <div class="row"><button class="btn" id="control" ${cur.videoSeen?"":"disabled"}>Video angeschaut – Kontrollaufgabe starten</button></div>
      ${cur.videoSeen?"":`<p class="small muted">Der Knopf wird aktiv, sobald du das Video geöffnet hast.</p>`}`;
  }
  return `<p class="feedback bad">✗ Leider wieder nicht richtig.</p>
    ${cur.showRight?`<p>Die richtige Antwort ist grün markiert. Vergleiche sie mit deiner Rechnung und suche deinen Fehler.</p>`:`<p><button class="linkbtn" id="showright">Richtige Antwort anzeigen</button></p>`}
    <div class="box lehrer">Dieses Teilgebiet ist als <b>„noch üben“</b> markiert. Schau dir das Video noch einmal in Ruhe an, nutze die Übung oder frag deine Lehrkraft.</div>
    ${videoBox(it,"Noch einmal ansehen")}
    <div class="row"><button class="btn ghost" id="extra">Noch eine ähnliche Aufgabe</button><button class="btn" id="next">Weiter zum nächsten Teilgebiet →</button></div>`;
}

function bind(){
  document.getElementById("back").onclick=home;
  app.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>openBereich(cur.b.id,+el.dataset.i));
  const $=id=>document.getElementById(id);
  if($("reveal")) $("reveal").onclick=()=>{cur.revealed=true;render();};
  app.querySelectorAll("[data-o]").forEach(el=>el.onclick=()=>{cur.sel=+el.dataset.o;render();});
  if($("check")) $("check").onclick=check;
  if($("next")) $("next").onclick=nextItem;
  if($("showright")) $("showright").onclick=()=>{cur.showRight=true;render();};
  app.querySelectorAll(".vlink").forEach(a=>a.addEventListener("click",()=>{ if(!cur.videoSeen){ cur.videoSeen=true; setTimeout(render,50);} }));
  if($("control")) $("control").onclick=()=>newControl("control");
  if($("extra")) $("extra").onclick=()=>newControl("extra");
}
function newControl(phase){
  const it=cur.b.items[cur.i];
  Object.assign(cur,{phase,task:makeTask(it,cur.task.q),sel:null,checked:false,revealed:false,showRight:false});
  render(); window.scrollTo(0,0);
}
function check(){
  if(cur.sel==null) return;
  cur.checked=true;
  const id=cur.b.items[cur.i].id, ok=cur.task.options[cur.sel].ok;
  if(cur.phase==="main") ST[id]=ok?"ok1":null;
  else ST[id]=ok?(ST[id]==="ok1"?"ok1":"ok2"):"fail";
  if(!ST[id]) delete ST[id];
  if(cur.phase==="main"&&!ok){ /* Status bleibt offen, bis die Kontrollaufgabe bearbeitet ist */ }
  save(); render();
}

function summary(b){
  history.replaceState(null,"","#"+b.id);
  const c=counts(b);
  app.innerHTML=`<div class="topbar"><button class="linkbtn" id="back">← Alle Bereiche</button></div>
  <div class="card"><h2>${b.titel} – deine Übersicht</h2>
  <p>${c.done} von ${c.n} Teilgebieten bearbeitet: <b>${c.ok1}</b> gleich richtig, <b>${c.ok2}</b> richtig nach dem Video, <b>${c.fail}</b> noch üben.</p>
  <table class="sum">${b.items.map((it,i)=>{const s=stat(it.id);return `<tr><td>${markHtml(s)}</td><td><b>${it.t}</b><br><span class="small muted">${s?MARK[s][1]:"noch offen"}</span>
    ${s==="fail"?`<div class="small"><a href="${YT(it.v[0][1])}" target="_blank" rel="noopener">Video</a>${it.u?` · <a href="${it.u}" target="_blank" rel="noopener">Übung</a>`:""}</div>`:""}</td>
    <td style="text-align:right"><button class="btn ghost small" data-i="${i}">${s?"Nochmal":"Starten"}</button></td></tr>`;}).join("")}</table>
  ${codeBox()}<div class="box lehrer small">Zeige diese Übersicht deiner Lehrkraft. Teilgebiete mit <b>!</b> solltest du noch einmal üben.</div></div>`;
  document.getElementById("back").onclick=home;
  app.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>openBereich(b.id,+el.dataset.i));
  window.scrollTo(0,0);
}

const h0=location.hash.slice(1), start=()=>{ if(BEREICHE.some(b=>b.id===h0)) openBereich(h0); else home(); };
if(DB.cur) start(); else loginScreen(start);
</script>
</body>
</html>
